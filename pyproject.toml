[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardware-deal-finder"
version = "0.2.0"
description = "Extensible hardware deal intelligence for homelabs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
dealfinder = "dealfinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dealfinder"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dealfinder"]
