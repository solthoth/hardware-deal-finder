apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hardware-deal-finder-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hardware-deal-finder
spec:
  schedule: "0 14 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hardware-deal-finder
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dealfinder
              image: ghcr.io/solthoth/hardware-deal-finder:latest
              imagePullPolicy: Always
              args:
                - watch
                - --format
                - json
                - --state
                - /state/dealfinder.db
              envFrom:
                - secretRef:
                    name: hardware-deal-finder-credentials
                    optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: hardware-deal-finder-state
            - name: temporary
              emptyDir: {}
